{% extends "base.html" %}{% block title %}Reset password{% endblock %}{% block public_content %}
<div class="auth-page"><section class="auth-card"><span class="eyebrow">ACCOUNT RECOVERY</span><h1>Reset your password</h1><p class="muted">Enter the verified email address associated with your account. If it matches, we will send a one-time reset link.</p><form method="post" class="form-stack"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Verified email<input type="email" name="email" autocomplete="email" maxlength="254" required></label><button class="btn primary full" type="submit">Send reset link</button></form><a href="{{ url_for('login') }}">Back to sign in</a></section></div>{% endblock %}
