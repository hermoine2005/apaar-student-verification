{% extends "base.html" %}{% block title %}Choose a new password{% endblock %}{% block public_content %}
<div class="auth-page"><section class="auth-card"><span class="eyebrow">ACCOUNT RECOVERY</span><h1>Choose a new password</h1><p class="muted">Use at least 12 characters. This link expires and can only be used once.</p><form method="post" class="form-stack"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>New password<input type="password" name="password" minlength="12" maxlength="256" autocomplete="new-password" required></label><label>Confirm password<input type="password" name="confirm_password" minlength="12" maxlength="256" autocomplete="new-password" required></label><button class="btn primary full" type="submit">Update password</button></form></section></div>{% endblock %}
